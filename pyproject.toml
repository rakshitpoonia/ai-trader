[project]
name = "ai-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.1",
    "massive>=2.8.0",
    # Capped at <2 because openai-agents requires mcp<2. With mcp>=2 the resolver had to
    # fall all the way back to openai-agents 0.0.7, which lacks the MCP tool filters and
    # session timeouts that backend/mcp_servers.py uses.
    "mcp>=1.24.0,<2",
    "openai-agents>=0.19.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]
